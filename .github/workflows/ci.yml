name: Imovelink CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    name: Typecheck, TDD Suite (Vitest) & Next.js SSR Build
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # O Sonar usa o histórico para atribuir cada problema ao seu commit.
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Static Analysis
        run: npm run typecheck

      - name: Run ESLint Static Analysis
        run: npm run lint

      - name: Run Automated TDD Test Suite with Coverage Gate (Vitest)
        run: npm run coverage

      - name: Publish Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: SonarCloud Static Analysis
        # Só roda quando o token existe; sem ele o pipeline segue sem falhar.
        if: env.SONAR_TOKEN != ''
        # SHA fixo em vez de tag: tag pode ser movida para outro commit.
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6

      - name: Build Production Next.js 15 App Router (SSR & API Routes)
        run: npm run build
