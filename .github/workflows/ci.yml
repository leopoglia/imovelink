name: Imovelink CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    name: Typecheck, TDD Suite (Vitest) & Next.js SSR Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Static Analysis
        run: npm run typecheck

      - name: Run Automated TDD Test Suite (Vitest)
        run: npm run test

      - name: Build Production Next.js 15 App Router (SSR & API Routes)
        run: npm run build
