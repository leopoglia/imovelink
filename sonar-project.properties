# Análise estática no SonarCloud, executada pelo pipeline.
# Rodar pelo CI (e não pela Análise Automática) é o que permite enviar o
# relatório de cobertura junto: a Análise Automática lê só o código-fonte.
sonar.projectKey=leopoglia_imovelink
sonar.organization=leopoglia
sonar.projectName=Imovelink

sonar.sources=src,scripts,database
sonar.tests=src/__tests__
sonar.sourceEncoding=UTF-8

# Fora da análise: testes como fonte, fixtures de HTML de terceiros e artefatos.
sonar.exclusions=src/__tests__/**,coverage/**,.next/**,node_modules/**,next-env.d.ts

# Cobertura gerada por `npm run coverage` no passo anterior do pipeline.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Dados de demonstração repetem estrutura por natureza; duplicação ali não é dívida.
sonar.cpd.exclusions=src/server/seeds/**,database/migrations/**
